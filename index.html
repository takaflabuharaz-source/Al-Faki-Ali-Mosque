    h2, h3 {
      color: #2d6a4f;
      text-align: center;
      margin-top: 5px;
      margin-bottom: 15px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #333;
      font-size: 14px;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-family: inherit;
      font-size: 14px;
    }

    .btn {
      width: 100%;
      background-color: #2d6a4f;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn-whatsapp {
      background-color: #25D366;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .record-card {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-right: 5px solid #2d6a4f;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 6px;
    }

    .record-title {
      font-weight: bold;
      color: #2d6a4f;
    }

    .record-details {
      font-size: 13px;
      color: #555;
      margin-top: 5px;
    }

    .ocr-preview {
      width: 100%;
      max-height: 150px;
      object-fit: contain;
      margin-top: 5px;
      display: none;
      border: 1px dashed #2d6a4f;
      border-radius: 6px;
    }

    .loader {
      display: none;
      text-align: center;
      color: #2d6a4f;
      font-size: 13px;
      margin-top: 5px;
    }

    /* تحسين خيارات التبويب */
    .tabs {
      display: flex;
      justify-content: space-around;
      margin-bottom: 15px;
      border-bottom: 2px solid #e0e0e0;
    }
    .tab {
      padding: 10px;
      cursor: pointer;
      font-weight: bold;
      color: #666;
    }
    .tab.active {
      color: #2d6a4f;
      border-bottom: 3px solid #2d6a4f;
    }

    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>مجمع الفكي علي الشيخ حماد</h2>

    <div class="tabs">
      <div class="tab active" onclick="switchTab('add')">إضافة تبرع</div>
      <div class="tab" onclick="switchTab('list')">سجل التبرعات</div>
    </div>

    <!-- نموذج إضافة تبرع -->
    <div id="addTab" class="tab-content active">
      <form id="donationForm">
        <div class="form-group">
          <label for="donorName">اسم المتبرع:</label>
          <input type="text" id="donorName" required placeholder="أدخل اسم المتبرع">
        </div>

        <div class="form-group">
          <label for="amount">المبلغ:</label>
          <input type="number" id="amount" required placeholder="أدخل المبلغ">
        </div>

        <div class="form-group">
          <label for="month">عن شهر:</label>
          <select id="month" required>
            <option value="">اختر الشهر</option>
            <option value="يناير">يناير</option>
            <option value="فبراير">فبراير</option>
            <option value="مارس">مارس</option>
            <option value="أبريل">أبريل</option>
            <option value="مايو">مايو</option>
            <option value="يونيو">يونيو</option>
            <option value="يوليو">يوليو</option>
            <option value="أغسطس">أغسطس</option>
            <option value="سبتمبر">سبتمبر</option>
            <option value="أكتوبر">أكتوبر</option>
            <option value="نوفمبر">نوفمبر</option>
            <option value="ديسمبر">ديسمبر</option>
          </select>
        </div>

        <div class="form-group">
          <label for="receiptImage">صورة الإشعار (اختياري - استخراج آلي):</label>
          <input type="file" id="receiptImage" accept="image/*" onchange="processImage(this)">
          <img id="imagePreview" class="ocr-preview" alt="معاينة الإشعار">
          <div id="ocrLoader" class="loader">جاري قراءة البيانات من الصورة...</div>
        </div>

        <div class="form-group">
          <label for="notes">ملاحظات:</label>
          <textarea id="notes" rows="2" placeholder="أي ملاحظات إضافية"></textarea>
        </div>

        <button type="submit" class="btn">حفظ الإشعار وإرسال الواتساب</button>
      </form>
    </div>

    <!-- سجل التبرعات -->
    <div id="listTab" class="tab-content">
      <h3>السجلات المسجلة</h3>
      <div id="recordsList">
        <!-- سيتم إضافة السجلات هنا ديناميكياً -->
      </div>
    </div>
  </div>

  <script>
    // PWA Install Event Handler
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const installBtn = document.getElementById('installAppBtn');
      if(installBtn) installBtn.style.display = 'block';
    });

    document.getElementById('installAppBtn')?.addEventListener('click', () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            console.log('User accepted the install prompt');
          }
          deferredPrompt = null;
        });
      }
    });

    // إدارة التبويبات
    function switchTab(tabName) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      
      if(tabName === 'add') {
        document.querySelectorAll('.tab')[0].classList.add('active');
        document.getElementById('addTab').classList.add('active');
      } else {
        document.querySelectorAll('.tab')[1].classList.add('active');
        document.getElementById('listTab').classList.add('active');
        loadRecords();
      }
    }

    // معالجة قراءة الصورة عبر Tesseract OCR
    async function processImage(input) {
      const file = input.files[0];
      if (!file) return;

      const preview = document.getElementById('imagePreview');
      const loader = document.getElementById('ocrLoader');
      
      preview.src = URL.createObjectURL(file);
      preview.style.display = 'block';
      loader.style.display = 'block';

      try {
        if (typeof Tesseract !== 'undefined') {
          const worker = await Tesseract.createWorker('ara');
          const ret = await worker.recognize(file);
          const text = ret.data.text;
          
          // استخراج الأرقام للمبلغ محلياً
          const numbers = text.match(/\d+/g);
          if (numbers && numbers.length > 0) {
            document.getElementById('amount').value = numbers[0];
          }
          await worker.terminate();
        }
      } catch (error) {
        console.log("OCR Error or not loaded yet", error);
      } finally {
        loader.style.display = 'none';
      }
    }

    // حفظ البيانات وتأكيد الإرسال عبر الواتساب
    document.getElementById('donationForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const name = document.getElementById('donorName').value.trim();
      const amount = parseFloat(document.getElementById('amount').value) || 0;
      const month = document.getElementById('month').value;
      const notes = document.getElementById('notes').value.trim();

      if (!name || !amount || !month) {
        alert("يرجى ملء جميع الحقول المطلوبة.");
        return;
      }

      // حفظ البيانات في LocalStorage
      const donationData = {
        id: Date.now(),
        name: name,
        amount: amount,
        month: month,
        notes: notes,
        date: new Date().toLocaleDateString('ar-EG')
      };

      let records = JSON.parse(localStorage.getItem('donations') || '[]');
      records.push(donationData);
      localStorage.setItem('donations', JSON.stringify(records));

      // حساب إجمالي المبلغ المتبرع به في هذا الشهر
      const monthTotal = records
        .filter(r => r.month === month)
        .reduce((sum, r) => sum + r.amount, 0);

      // إعادة تصفية النموذج
      document.getElementById('donationForm').reset();
      document.getElementById('imagePreview').style.display = 'none';

      // تجهيز رسالة الواتساب وتوجيهها
      const message = `السلام عليكم ورحمة الله وبركاته\n\n` +
                      `شكراً للمتبرع: ${name}\n` +
                      `تم استلام مبلغ التبرع: ${amount}\n` +
                      `عن شهر: ${month}\n` +
                      `إجمالي المبلغ المتبرع به في هذا الشهر (${month}): ${monthTotal}\n\n` +
                      `جعلها الله في ميزان حسناتك`;

      const whatsappUrl = `https://wa.me/?text=${encodeURIComponent(message)}`;
      
      alert("تم حفظ الإشعار بنجاح! سيتم تحويلك الآن إلى الواتساب لإرسال الإشعار.");
      window.open(whatsappUrl, '_blank');
    });

    // عرض السجلات المخزنة
    function loadRecords() {
      const listContainer = document.getElementById('recordsList');
      const records = JSON.parse(localStorage.getItem('donations') || '[]');
      
      if(records.length === 0) {
        listContainer.innerHTML = '<p style="text-align:center; color:#777;">لا توجد سجلات حالياً</p>';
        return;
      }

      listContainer.innerHTML = '';
      records.reverse().forEach(rec => {
        const card = document.createElement('div');
        card.className = 'record-card';
        card.innerHTML = `
          <div class="record-title">${rec.name}</div>
          <div class="record-details">
            المبلغ: <strong>${rec.amount}</strong> | شهر: <strong>${rec.month}</strong><br>
            التاريخ: ${rec.date} ${rec.notes ? '| ملاحظات: ' + rec.notes : ''}
          </div>
        `;
        listContainer.appendChild(card);
      });
    }

    // تسجيل الخدمة للحفظ وإمكانية العمل بدون إنترنت Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
